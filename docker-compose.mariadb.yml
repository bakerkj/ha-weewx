services:
  mariadb:
    image: mariadb:12
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: weewx
      MARIADB_USER: weewx
      MARIADB_PASSWORD: weewxpass
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-prootpass",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  weewx:
    image: ha-weewx-test
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./test/mariadb/weewx.conf:/config/weewx.conf:ro
    environment:
      S6_KEEP_ENV: 1
    # Healthy once weewxd has written its first archive record to MariaDB.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb -h mariadb -uweewx -pweewxpass weewx -N -e 'SELECT COUNT(*)
          FROM archive' 2>/dev/null | grep -qE '[1-9]'",
        ]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 5s

  # pytest e2e — asserts the MariaDB-backed path (archive rows in MariaDB,
  # Seasons report served by nginx). Run with:
  #   docker compose -f docker-compose.mariadb.yml up --build \
  #     --abort-on-container-exit --exit-code-from e2e-tests
  e2e-tests:
    build:
      context: ./e2e-tests
    image: ha-weewx-e2e:test
    depends_on:
      weewx:
        condition: service_healthy
    environment:
      MARIADB_HOST: mariadb
      MARIADB_USER: weewx
      MARIADB_PASSWORD: weewxpass
      MARIADB_DB: weewx
      WEEWX_URL: http://weewx:8099
    volumes:
      - ./test-results:/test-results
    command:
      [
        "pytest",
        "-v",
        "tests/test_mariadb.py",
        "--junit-xml=/test-results/mariadb-junit.xml",
      ]
