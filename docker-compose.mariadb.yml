services:
  mariadb:
    image: mariadb:12
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: weewx
      MARIADB_USER: weewx
      MARIADB_PASSWORD: weewxpass
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-prootpass",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  weewx:
    image: ha-weewx-test
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./test/mariadb/weewx.conf:/config/weewx.conf:ro
    environment:
      S6_KEEP_ENV: 1
    # Healthy once weewxd has written its first archive record to MariaDB.
    # Uses PyMySQL (already in the runtime venv) so the addon image needs
    # no mariadb CLI at runtime.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/weewx/bin/python3 -c "import pymysql,sys;
          c=pymysql.connect(host=''mariadb'',user=''weewx'',password=''weewxpass'',database=''weewx'');
          cur=c.cursor(); cur.execute(''SELECT COUNT(*) FROM archive'');
          sys.exit(0 if cur.fetchone()[0]>=1 else 1)" 2>/dev/null',
        ]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 5s

  # pytest e2e — asserts the MariaDB-backed path (archive rows in MariaDB,
  # Seasons report served by nginx). Run with:
  #   docker compose -f docker-compose.mariadb.yml up --build \
  #     --abort-on-container-exit --exit-code-from e2e-tests
  e2e-tests:
    build:
      context: ./e2e-tests
    image: ha-weewx-e2e:test
    depends_on:
      weewx:
        condition: service_healthy
    environment:
      MARIADB_HOST: mariadb
      MARIADB_USER: weewx
      MARIADB_PASSWORD: weewxpass
      MARIADB_DB: weewx
      WEEWX_URL: http://weewx:8099
    volumes:
      - ./test-results:/test-results
    command:
      [
        "pytest",
        "-v",
        "tests/test_mariadb.py",
        "--junit-xml=/test-results/mariadb-junit.xml",
      ]
