worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

# Load dynamic modules explicitly (this config does not include
# /etc/nginx/modules-enabled/): the brotli output filter
# (libnginx-mod-http-brotli-filter) and njs (libnginx-mod-http-js), the latter
# powering the per-request NOAA Cache-Control filter below.
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # Compress the text payload (HTML/CSS/JS/JSON/XML/SVG) on the wire to shrink
    # what crosses the network, including to a downstream caching proxy. brotli
    # is preferred when the client offers it (better ratio, universal browser
    # support); gzip is the fallback for clients that only accept gzip. PNG chart
    # images are already compressed, so they are absent from the *_types lists.
    # (zstd is not packaged for nginx in trixie; brotli is the better choice.)
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types text/plain text/css text/javascript application/javascript
                 application/json application/xml text/xml image/svg+xml
                 application/rss+xml;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml text/xml image/svg+xml
               application/rss+xml;

    # njs module that computes Cache-Control for NOAA climate reports per
    # request (current month/year vs. immutable history). See the /NOAA/
    # location below and rootfs/etc/nginx/njs/noaa.js.
    js_import noaa from /etc/nginx/njs/noaa.js;

    # Use writable temp paths so the worker can run under any uid.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        # Listens on the HA Supervisor ingress port. Supervisor proxies the
        # external request to this port, prepending X-Ingress-Path which we
        # accept transparently for relative-link static content.
        listen 8099 default_server;
        server_name _;

        root /config/www;
        index index.html index.htm;

        # archive_interval (from weewx.conf) exposed as an nginx variable by
        # nginx-init.sh, read by the NOAA njs filter below.
        include /tmp/nginx-archive-interval.conf;

        # Per-tier Cache-Control for static assets and chart PNGs. nginx-init.sh
        # writes per-period defaults here, OR copies a user-supplied
        # /config/nginx-cache.conf verbatim (validated; falls back to the
        # defaults if it breaks). Lives at server scope because it defines its
        # own location blocks. See README "Tuning report caching".
        include /tmp/nginx-cache.conf;

        location / {
            try_files $uri $uri/ =404;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            # HTML pages (and the autoindex root) regenerate every archive cycle.
            # nginx-init.sh derives the window from weewx.conf [StdArchive]
            # archive_interval (fallback 300s) and expires it relative to each
            # file's mtime, so a downstream proxy serves a report until its next
            # regeneration, then revalidates with a cheap 304 (ETag stays on).
            include /tmp/nginx-report-cache.conf;
        }

        # Versioned static-asset cache. Skins that append `?v=<asset_version>`
        # to every JS / CSS / SVG / font / favicon URL (cache-buster knob
        # bumped at deploy time) opt into day-scale caching here. A bump
        # of asset_version changes the URL -> new cache entry; the old
        # entry ages out naturally. Without a bump, clients revalidate
        # every 24 h — short enough that a "forgot to bump" deploy isn't
        # invisible for a week. The query string only matters for the
        # client and any upstream HTTP cache; nginx ignores it for
        # try_files path matching. Regex `~*` location takes precedence
        # over the catch-all prefix `location /` above regardless of
        # file order (nginx matching rules), so files like /scripts/foo.js
        # land here instead of the report-cache include.
        location ~* \.(?:js|css|svg|woff2?|ico|map)$ {
            expires 24h;
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        # NOAA climate reports. WeeWX rewrites only the current month/year
        # summaries each cycle; older files are immutable. nginx can't tell them
        # apart by URL (no notion of "today"), so an njs header filter sets
        # Cache-Control per request: current period -> archive_interval window,
        # everything else -> 24h. Correct across month/year rollovers, no reload.
        location ^~ /NOAA/ {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            js_header_filter noaa.setCache;
        }

        # robots.txt is hand-authored and effectively static, so cache it flat
        # for a day. (expires modified would no-cache it once its mtime aged past
        # the window — the same reason immutable files can't use an mtime tier.)
        location = /robots.txt {
            expires 24h;
            add_header Cache-Control "public" always;
        }

        # Realtime Gauge Data — rtgd writes /dev/shm/weewx/gauge-data.txt
        # every loop packet (small JSON, ~10 KB). Expose at the ingress root
        # so the SteelSeries-style gauges or any other client can fetch it.
        # A 1s window throttles a hammering client / downstream proxy without
        # going meaningfully stale.
        location = /gauge-data.txt {
            alias /dev/shm/weewx/gauge-data.txt;
            add_header Cache-Control "public, max-age=1" always;
            default_type application/json;
        }
    }
}
