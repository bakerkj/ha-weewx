worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # Use writable temp paths so the worker can run under any uid.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        # Listens on the HA Supervisor ingress port. Supervisor proxies the
        # external request to this port, prepending X-Ingress-Path which we
        # accept transparently for relative-link static content.
        listen 8099 default_server;
        server_name _;

        root /config/www;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }

        # Realtime Gauge Data — rtgd writes /dev/shm/weewx/gauge-data.txt
        # every loop packet (small JSON, ~10 KB). Expose at the ingress root
        # so the SteelSeries-style gauges or any other client can fetch it.
        location = /gauge-data.txt {
            alias /dev/shm/weewx/gauge-data.txt;
            add_header Cache-Control "no-store";
            default_type application/json;
        }
    }
}
