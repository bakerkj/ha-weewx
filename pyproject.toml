[project]
name = "ha-weewx"
version = "0.1.30" # x-release-please-version
description = "WeeWX Home Assistant add-on (runtime dependency lock)"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "weewx==5.4.0",
    # The MQTT publisher (by felddy) as a release zip (not git+) so uv
    # needs no git CLI.
    "weewx-home-assistant @ https://github.com/felddy/weewx-home-assistant/archive/v1.0.0.zip",
    # weewx pulls PyMySQL itself for MariaDB/MySQL; no compiled mysqlclient.
    "configobj>=5.0.9",
    # Used by some bundled extensions (e.g. realtime-gauge-data) for Py2/3 compat.
    "six>=1.16",
    # HTTP client used by user.purpleair (and most other "uploader" extensions).
    "requests>=2.32",
]

[tool.uv]
required-version = "==0.12.0"
package = false

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
mypy_path = ["extensions"]

# weewx + weeutil + configobj ship without py.typed; silence the
# import noise without weakening checks on our own code.
# The MQTT publisher (by felddy) ships without py.typed too;
# homeassistant is only installed in the build/test image, not the dev
# venv; user.* is a runtime package built at /opt/weewx-data/bin/user.
[[tool.mypy.overrides]]
module = [
    "weewx.*",
    "weeutil.*",
    "configobj",
    "weewx_ha.*",
    "homeassistant.*",
    "user.*",
]
ignore_missing_imports = true
