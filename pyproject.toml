[project]
name = "ha-weewx"
version = "0.1.0"
description = "WeeWX Home Assistant add-on (runtime dependency lock)"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "weewx==5.3.1",
    # felddy's weewx_ha as a release zip (not git+) so uv needs no git CLI.
    "weewx-home-assistant @ https://github.com/felddy/weewx-home-assistant/archive/v1.0.0.zip",
    # weewx pulls PyMySQL itself for MariaDB/MySQL; no compiled mysqlclient.
    "configobj>=5.0.9",
    # Used by some bundled extensions (e.g. realtime-gauge-data) for Py2/3 compat.
    "six>=1.16",
    # HTTP client used by user.purpleair (and most other "uploader" extensions).
    "requests>=2.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
files = ["extensions", "tests"]
python_version = "3.13"
# weewx + weeutil ship without py.typed; we don't want to depend on
# third-party stubs that aren't maintained. Silence the import noise
# without weakening checks on our own code.
[[tool.mypy.overrides]]
module = ["weewx.*", "weeutil.*", "configobj"]
ignore_missing_imports = true
