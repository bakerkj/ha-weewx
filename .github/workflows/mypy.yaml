name: mypy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          cache-dependency-glob: "uv.lock"
          cache-suffix: mypy
      # mypy's incremental cache cuts warm runs to a small fraction of
      # cold-run time. Key on uv.lock + commit SHA so every run saves a
      # fresh cache, with restore-keys falling back to any cache for the
      # same uv.lock and then any cache at all.
      - uses: actions/cache@v5.0.5
        with:
          path: .mypy_cache
          key:
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ runner.os }}-
      - run: uv run mypy build extensions tests
