name: renovate-validate

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/**
      - .github/scripts/**

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key:
            renovate-${{ hashFiles('.github/workflows/renovate-validate.yml') }}

      - name: Schema validation
        run:
          npx --package renovate@44.42.1 -- renovate-config-validator
          renovate.json

      - name: Dry-run lookup test
        env:
          LOG_FORMAT: json
          LOG_LEVEL: debug
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bearer-token auth for github-apt-helper.keneli.org (our proxy
          # that serves trixie-updates/trixie-security Packages.gz — Debian
          # publishes those as .xz only, unsupported by Renovate's built-in
          # `deb` datasource; upstream renovatebot/renovate#35865). Mend's
          # scheduled Renovate runs pick up the token via a bakerkj-org-level
          # Host Rule; this CI dry-run injects it via RENOVATE_HOST_RULES as
          # an inline-JSON env-var overlay (Mend's org config is not in
          # scope on a GH Actions runner). Matches the sibling pattern
          # documented in /tmp/apk-apt-coordination-decisions.md §4.
          RENOVATE_HOST_RULES: >-
            [{"matchHost":"github-apt-helper.keneli.org","token":"${{
            secrets.APT_HELPER_TOKEN }}"}]
        run: |
          # LOG_FORMAT=json emits one JSON event per line so downstream
          # checks can parse the structured log instead of regex-scraping
          # interleaved text output.
          npx --package renovate@44.42.1 -- renovate --dry-run --platform=local > renovate-dry-run.jsonl 2>&1 || true

          # Check for datasource lookup failures (msg field per log event).
          errors=$(jq -r 'select(.msg | tostring | test("no-result|Failed to look up"; "i")) | .msg' renovate-dry-run.jsonl 2>/dev/null | grep -v "python-version" || true)
          if [ -n "$errors" ]; then
            echo "::error::Renovate datasource lookup failures detected:"
            echo "$errors"
            exit 1
          fi

          echo "All datasource lookups succeeded"

      - name: Cross-check Renovate's apt updates against actual Debian archives
        run: |
          # Boots a debian:trixie container with apt's trixie + trixie-updates
          # + trixie-security suites and verifies, for every Renovate-proposed
          # apt-package update:
          #
          #   (a) the proposed newVersion compares >= the currently pinned
          #       version per `dpkg --compare-versions ... ge` (no downgrades);
          #   (b) the proposed newVersion appears in `apt-cache madison <pkg>`
          #       for the binary (catches misconfigured overridePackageName
          #       rules that resolve a binary to a wrong-upstream source --
          #       Renovate happily lifts a "newer" version from a different
          #       upstream family, which would break the build).
          #
          # The script reads Renovate's dry-run trace log from the previous
          # step. apt is the authoritative source of truth here; Repology is
          # not.
          docker run --rm -v "$PWD:/work" -w /work debian:trixie bash -c '
            set -euo pipefail
            # Append -updates and -security suites to apt sources. The classic
            # one-line `deb http://...` syntax inherits the base image keyring
            # without the Signed-By collision that DEB822 hits.
            cat >>/etc/apt/sources.list <<SRC
          deb http://deb.debian.org/debian trixie-updates main
          deb http://deb.debian.org/debian-security trixie-security main
          SRC
            apt-get update -qq
            # debian:trixie minimal image does not ship python3.
            apt-get install -y --no-install-recommends python3 >/dev/null
            python3 /work/.github/scripts/check-renovate-apt.py renovate-dry-run.jsonl
          '
