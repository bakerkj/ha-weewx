name: addon-lint

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  addon-linter:
    name: Lint add-on
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ha-weewx is a single add-on living at the repo root (config.json here),
      # so lint the whole repo rather than a per-addon subdirectory.
      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "."
