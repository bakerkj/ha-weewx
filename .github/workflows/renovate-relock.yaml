name: renovate-relock

# Renovate's regex customManagers do text substitution in pyproject.toml
# without touching uv.lock, failing `uv lock --check`. Relock on the PR
# branch and push back so tests go green.
#
# PAT (not GITHUB_TOKEN) because GITHUB_TOKEN pushes don't re-trigger
# workflows. `persist-credentials: false` keeps the write-scoped PAT out
# of .git/config while `uv lock` runs the archive-URL dep's PEP 517
# build backend (untrusted upstream code).
#
# Loop guard: the actor check. The paths filter does NOT help here -
# pull_request paths match the cumulative three-dot diff, so relock
# synchronize events still match pyproject.toml.

on:
  pull_request:
    paths:
      - pyproject.toml

permissions:
  contents: read

jobs:
  relock:
    if: github.actor == 'renovate[bot]'
    # Job-level so human pushes (skipped by `if:`) don't cancel in-flight relocks.
    concurrency:
      group: renovate-relock-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv lock
      - name: Commit and push if uv.lock changed
        env:
          RELOCK_TOKEN: ${{ secrets.RENOVATE_RELOCK_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet uv.lock; then
            echo "uv.lock already in sync; nothing to do."
            exit 0
          fi
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(uv): relock after Renovate dep bump"
          git push "https://x-access-token:${RELOCK_TOKEN}@github.com/${REPO}.git" "HEAD:${HEAD_REF}"
