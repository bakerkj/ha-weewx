name: addon-lint

on:
  pull_request:
  push:
    # Pushes to PR branches are already covered by the pull_request event;
    # scoping push to main avoids the double-fire footgun (one push + one
    # pull_request event for the same SHA = lint runs twice).
    branches: [main]

permissions:
  contents: read

jobs:
  addon-linter:
    name: Lint add-on
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ha-weewx is a single add-on living at the repo root (config.json here),
      # so lint the whole repo rather than a per-addon subdirectory.
      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "."
