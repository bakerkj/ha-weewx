name: addon-build

# Single add-on at the repo root. Two modes:
#   release : tag push shaped v<X>.<Y>.<Z>  -> build + PUSH to GHCR, tags = version + latest
#   smoke   : any other push / PR           -> build only (push=false), tag = test
# The published images back the `image:` key in config.json so Home Assistant
# pulls a prebuilt image instead of building on-device.

on:
  pull_request:
  push:
    # Pushes to PR branches are already covered by the pull_request event;
    # scoping push to main + release tags avoids the double-fire footgun
    # (one push + one pull_request event for the same SHA = 4 builds).
    # Tag matchers track the patterns the release-mode script accepts in
    # the `discover` job: bare `v*.*.*` or component-prefixed `*-v*.*.*`.
    branches: [main]
    tags:
      - "v*"
      - "*-v*"

permissions:
  contents: read
  packages: write

jobs:
  discover:
    name: Discover arches
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      mode: ${{ steps.matrix.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build matrix from config.json
        id: matrix
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          mode="smoke"
          version="test"
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            # release-please tags the (single) package with its component name,
            # e.g. ha-weewx-v0.1.1; also accept a bare v0.1.1. Strip everything
            # up to and including the last 'v' to get the version.
            case "$REF_NAME" in
              v*.*.* | *-v*.*.*)
                mode="release"
                version="${REF_NAME##*v}"
                ;;
              *)
                echo "tag '$REF_NAME' is not v*.*.* / *-v*.*.* -> skip"
                echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
                echo "mode=skip" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi

          matrix='{"include":['
          first=true
          arches=$(python3 -c "import json; print(' '.join(json.load(open('config.json'))['arch']))")
          for arch in $arches; do
            if [ "$arch" = "amd64" ]; then
              runner="ubuntu-24.04"
            elif [ "$arch" = "aarch64" ]; then
              runner="ubuntu-24.04-arm"
            else
              continue
            fi
            if [ "$first" = true ]; then first=false; else matrix+=','; fi
            matrix+="{\"arch\":\"$arch\",\"runner\":\"$runner\",\"version\":\"$version\"}"
          done
          matrix+=']}'
          echo "mode: $mode"
          echo "matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: discover
    if: needs.discover.outputs.mode != 'skip'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build a locally-loadable copy of the image FIRST so the next step
      # can run in-image self-checks against it, then let the
      # home-assistant/builder action do the actual publish. Both builds
      # share the same gha layer cache, so the second build is near-free
      # on cache hit. Catches per-arch regressions (different wheel set,
      # libusb version, etc.) BEFORE the registry push.
      - name: Build add-on image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ha-weewx-smoke
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:trixie
            BUILD_VERSION=${{ matrix.version }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}-ha-weewx-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.arch }}-ha-weewx-${{ matrix.arch }}

      - name: Run in-image self-checks (${{ matrix.arch }})
        run: |
          docker run --rm --entrypoint /bin/bash \
            -v "${PWD}:/work" \
            ha-weewx-smoke \
            /work/build/check_image.sh

      - name: Build add-on image (publish)
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry: ghcr.io
          image:
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-ha-weewx
          image-tags: |
            ${{ needs.discover.outputs.mode == 'release' && matrix.version || 'test' }}
            ${{ needs.discover.outputs.mode == 'release' && 'latest' || '' }}
          version: ${{ matrix.version }}
          push:
            ${{ needs.discover.outputs.mode == 'release' && 'true' || 'false' }}
          load: "false"
          context: .
          cache-gha-scope: ha-weewx-${{ matrix.arch }}
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
