name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-checks:
    name: Build-time self-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Self-contained checks baked into the Dockerfile `test` stage: binary
      # runs, deps + user extensions import, patches applied, stock skins
      # present, weewx-mqtt removed. No external services. The gha layer cache
      # restores the base/apt/uv/extension layers between runs, so unchanged
      # builds skip those steps (shared 'ha-weewx-test' scope with the e2e job).
      - name: Build + run self-contained checks
        run: |
          docker buildx build --target test \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie \
            --cache-from type=gha,scope=ha-weewx-test \
            --cache-to type=gha,mode=max,scope=ha-weewx-test \
            .

  maria-mqtt:
    name: "e2e: maria + mqtt"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Pre-build the add-on image with the shared gha layer cache and load it
      # as ha-weewx-test, so the layers (base/apt/uv/extensions) are restored
      # between runs; then run the e2e with BUILD=0 to reuse that image.
      - name: Build add-on image (cached)
        run: |
          docker buildx build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie \
            --cache-from type=gha,scope=ha-weewx-test \
            --cache-to type=gha,mode=max,scope=ha-weewx-test \
            -t ha-weewx-test --load .
      # Runs the pytest e2e suite via docker-compose.test.yml (MariaDB storage,
      # MQTT discovery + state_class + availability, Seasons report) against the
      # prebuilt image, plus the syslog-spam guard.
      - name: Run pytest e2e
        run: BUILD=0 ./scripts/test-maria-n-mqtt.sh
      - name: Upload e2e results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-results
          path: test-results/junit.xml
          if-no-files-found: ignore

  nginx-cache:
    name: "e2e: nginx cache"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Read the shared gha layer cache (the build-checks/integration jobs
      # populate it); build + load the add-on image, then assert the nginx
      # Cache-Control tiers, brotli/gzip, the NOAA njs filter, and the override.
      - name: Build add-on image (cached)
        run: |
          docker buildx build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie \
            --cache-from type=gha,scope=ha-weewx-test \
            -t ha-weewx-cache-test --load .
      - name: Run cache tests
        run: BUILD=0 IMAGE=ha-weewx-cache-test ./scripts/test-cache.sh

  sqlite-template:
    name: "e2e: sqlite + template"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Read the shared gha layer cache; build + load the add-on image, then run
      # it with an empty /config and assert the default new-user path: the
      # template seeds, weewxd runs on Simulator + SQLite, writes an archive
      # record, and the Seasons report is generated and served by nginx.
      - name: Build add-on image (cached)
        run: |
          docker buildx build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie \
            --cache-from type=gha,scope=ha-weewx-test \
            -t ha-weewx-sqlite-template-test --load .
      - name: Run sqlite + template e2e
        run:
          BUILD=0 IMAGE=ha-weewx-sqlite-template-test
          ./scripts/test-sqlite-n-template.sh

  watchdog:
    name: "e2e: watchdog"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Read the shared gha layer cache; build + load the add-on image, then
      # verify: killing weewxd exits the container, killing nginx exits the
      # container, and the HTTP-poll watchdog triggers an exit when its
      # configured path stays stale.
      - name: Build add-on image (cached)
        run: |
          docker buildx build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie \
            --cache-from type=gha,scope=ha-weewx-test \
            -t ha-weewx-watchdog-test --load .
      - name: Run watchdog e2e
        run: BUILD=0 IMAGE=ha-weewx-watchdog-test ./scripts/test-watchdog.sh
