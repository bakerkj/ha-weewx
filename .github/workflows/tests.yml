name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --group dev --frozen
      - name: Run pytest
        run: uv run pytest --junit-xml=test-results/junit.xml
      - name: Upload unit-test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: unit-test-results
          path: test-results/junit.xml
          if-no-files-found: ignore

  build-checks:
    name: Build-time self-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HA_VERSION: "2026.1.3"
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # uv on the host runner — the MQTT-publisher unit validation host
      # script uses it to build a transient venv with homeassistant +
      # weewx. setup-uv caches the wheels keyed on HA_VERSION so a bump
      # cleanly invalidates.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-suffix: ha-${{ env.HA_VERSION }}
      # Guard rail for build/extensions.txt: every URL must be preceded
      # by at least one `# install: <path>` annotation in its paragraph.
      # check_image.sh derives its per-extension presence assertions from
      # those annotations, so an un-annotated URL silently ships without
      # any in-image verification. Runs on the host before docker build
      # so a bad commit fails immediately, not after the image cooks.
      - name: Verify extensions.txt URLs are annotated
        run: python3 build/check_extensions_annotated.py
      # Build the addon image with the shared gha layer cache and load
      # it as ha-weewx-test (shared 'ha-weewx-test' scope with the e2e
      # jobs so unchanged builds skip the apt/uv/extension layers).
      # Uses docker/build-push-action rather than a raw `docker buildx
      # build` shell step: GHA does not expose ACTIONS_RUNTIME_TOKEN to
      # plain shell `run:` envs, so `--cache-to type=gha` is silently
      # no-op'd from a `run:` block. The action retrieves the token via
      # the JS API and exports it for buildx, so cache export actually
      # happens.
      - name: Build add-on image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ha-weewx-test
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie
          cache-from: |
            type=gha,scope=ha-weewx-test
          cache-to: |
            type=gha,mode=max,scope=ha-weewx-test
      # In-image asserts (binary version, dep imports, patch hunks,
      # bundled extensions, stock skins, s6 wiring). `docker run` (not
      # `docker buildx build`) so the default docker driver sees the
      # locally-loaded tag; --entrypoint /bin/bash bypasses the s6 init
      # that would otherwise boot weewxd/nginx instead of the script.
      - name: Run in-image self-checks
        run: |
          docker run --rm --entrypoint /bin/bash \
            -v "${PWD}:/work" \
            ha-weewx-test \
            /work/build/check_image.sh
      # MQTT publisher (by felddy) -> HA unit validation against a
      # transient host venv with homeassistant + weewx. Extracts the
      # patched weewx_ha and bundled user/ from the built image with
      # `docker cp`; no apt/pip mutation of the addon image itself.
      - name: Run MQTT publisher (by felddy) unit validation (host)
        run: ./build/check_mqtt_publisher_ha_units_host.sh

  mariadb:
    name: "e2e: mariadb"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Cache the sidecar (mariadb:12) + the e2e-tests image as tarballs
      # so we skip the ~5-10 s registry pull + ~5 s pip-install on every
      # run. Key includes the compose file (sidecar tag) and the entire
      # e2e-tests/ tree (pytest deps); restore-keys lets us reuse a
      # near-match while the new entry is being computed.
      - name: Restore docker image cache
        id: docker-cache
        uses: actions/cache@v5.0.5
        with:
          path: /tmp/docker-images
          key:
            docker-mariadb-${{ hashFiles('docker-compose.mariadb.yml',
            'e2e-tests/**') }}
          restore-keys: |
            docker-mariadb-
      - name: Load cached images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          for f in /tmp/docker-images/*.tar; do
            [ -f "$f" ] && docker load -i "$f"
          done
      - name: Build add-on image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ha-weewx-test
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie
          cache-from: |
            type=gha,scope=ha-weewx-test
          cache-to: |
            type=gha,mode=max,scope=ha-weewx-test
      # MariaDB-backed e2e: archive rows land in MariaDB, Seasons report
      # served by nginx. MQTT/discovery/rain24h/xaggs are covered in the
      # `mqtt` job below.
      - name: Run pytest e2e (mariadb)
        run: BUILD=0 ./scripts/test-mariadb.sh
      - name: Save docker images for cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-images
          docker save mariadb:12 -o /tmp/docker-images/mariadb.tar
          docker save ha-weewx-e2e:test -o /tmp/docker-images/e2e.tar
      - name: Upload mariadb e2e results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-mariadb-results
          path: test-results/mariadb-junit.xml
          if-no-files-found: ignore

  mqtt:
    name: "e2e: mqtt"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Same caching pattern as the mariadb job, but for the mosquitto
      # sidecar. mosquitto:2 is only ~10 MB so the pull is cheap; the
      # bigger win here is the cached e2e-tests image (pip install).
      - name: Restore docker image cache
        id: docker-cache
        uses: actions/cache@v5.0.5
        with:
          path: /tmp/docker-images
          key:
            docker-mqtt-${{ hashFiles('docker-compose.mqtt.yml', 'e2e-tests/**')
            }}
          restore-keys: |
            docker-mqtt-
      - name: Load cached images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          for f in /tmp/docker-images/*.tar; do
            [ -f "$f" ] && docker load -i "$f"
          done
      - name: Build add-on image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ha-weewx-test
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie
          cache-from: |
            type=gha,scope=ha-weewx-test
          cache-to: |
            type=gha,mode=max,scope=ha-weewx-test
      # MQTT-backed e2e against the MQTT publisher's (by felddy) HA
      # discovery surface. Storage
      # is SQLite (MariaDB-as-backend is covered by the `mariadb` job),
      # so this job only needs the mosquitto sidecar. All MQTT assertions
      # share a session-scoped subscriber — one bounded wait covers them
      # all instead of per-test settle sleeps.
      - name: Run pytest e2e (mqtt)
        run: BUILD=0 ./scripts/test-mqtt.sh
      - name: Save docker images for cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-images
          docker save eclipse-mosquitto:2 -o /tmp/docker-images/mosquitto.tar
          docker save ha-weewx-e2e:test -o /tmp/docker-images/e2e.tar
      - name: Upload mqtt e2e results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-mqtt-results
          path: test-results/mqtt-junit.xml
          if-no-files-found: ignore

  nginx-cache:
    name: "e2e: nginx cache"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Read the shared gha layer cache (the build-checks/integration jobs
      # populate it); build + load the add-on image, then assert the nginx
      # Cache-Control tiers, brotli/gzip, the NOAA njs filter, and the override.
      - name: Build add-on image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ha-weewx-cache-test
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie
          cache-from: |
            type=gha,scope=ha-weewx-test
      - name: Run cache tests
        run: BUILD=0 IMAGE=ha-weewx-cache-test ./scripts/test-cache.sh

  sqlite-template:
    name: "e2e: sqlite + template"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Read the shared gha layer cache; build + load the add-on image, then run
      # it with an empty /config and assert the default new-user path: the
      # template seeds, weewxd runs on Simulator + SQLite, writes an archive
      # record, and the Seasons report is generated and served by nginx.
      - name: Build add-on image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ha-weewx-sqlite-template-test
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie
          cache-from: |
            type=gha,scope=ha-weewx-test
      - name: Run sqlite + template e2e
        run:
          BUILD=0 IMAGE=ha-weewx-sqlite-template-test
          ./scripts/test-sqlite-n-template.sh

  watchdog:
    name: "e2e: watchdog"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Read the shared gha layer cache; build + load the add-on image, then
      # verify: killing weewxd exits the container, killing nginx exits the
      # container, and the HTTP-poll watchdog triggers an exit when its
      # configured path stays stale.
      - name: Build add-on image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ha-weewx-watchdog-test
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie
          cache-from: |
            type=gha,scope=ha-weewx-test
      - name: Run watchdog e2e
        run: BUILD=0 IMAGE=ha-weewx-watchdog-test ./scripts/test-watchdog.sh
