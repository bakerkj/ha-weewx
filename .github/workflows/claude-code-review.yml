name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: only run on specific file changes.
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

permissions:
  contents: read

jobs:
  claude-review:
    name: Auto code-review
    # Skip auto-generated PRs:
    #   * Renovate / Dependabot — already gated by CI + the SHA-pin review
    #     flow; an LLM pass on every weekly bump is noise + credit burn.
    #   * release-please — its PRs are authored by the user (PAT-driven, so
    #     user.login isn't a bot), but the head branch is always prefixed
    #     `release-please--`, which is the reliable signal.
    if: |
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release-please--')
    # Optional: also filter by PR author / association.
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt:
            "/code-review:code-review ${{ github.repository }}/pull/${{
            github.event.pull_request.number }}"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options.
      # The action's SDK call writes a JSONL transcript (per-turn tool_use,
      # tool_result, permission events) to runner.temp/claude-execution-output.json.
      # The action redacts those events from the public CI log "for security";
      # uploading the raw record as an artifact keeps it visible only to
      # collaborators — needed for diagnosing permission denials and turn-count
      # blowups. `if: always()` so we capture failures too.
      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name:
            claude-execution-output-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 14
