name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: only run on specific file changes.
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

permissions:
  contents: read

jobs:
  claude-review:
    name: Auto code-review
    # Skip auto-generated PRs:
    #   * Renovate / Dependabot — already gated by CI + the SHA-pin review
    #     flow; an LLM pass on every weekly bump is noise + credit burn.
    #   * release-please — its PRs are authored by the user (PAT-driven, so
    #     user.login isn't a bot), but the head branch is always prefixed
    #     `release-please--`, which is the reliable signal.
    if: |
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release-please--')
    # Optional: also filter by PR author / association.
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # write needed so the action can post review comments and update the
      # progress-tracking comment that track_progress creates.
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Flips mode from `agent` to `tag`, which auto-loads the
          # github_comment MCP server and creates a tracking comment with
          # progress checkboxes so a failure still leaves a visible trail.
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is a Home Assistant add-on packaging WeeWX 5.x + a set of
            patched WeeWX extensions, served behind nginx. Patches live in
            `patches/` and target either the venv-installed `weewx_ha`
            module or third-party extensions; the build verifies them in
            `build/check_image.sh`.

            Review this PR. Prioritize, in order:

            1. Bugs — logic errors, race conditions, off-by-ones,
               broken edge cases. If you find one, leave an inline
               comment at the specific line.
            2. CI / build correctness.
            3. Patch hygiene.
            4. Security.
            5. Missing tests — call out behavior changes that
               landed without a test, or a tight test that would
               have caught a likely regression.

            Hard rules:

            - Do NOT comment on style, naming, formatting, or "consider
              adding a docstring" — the repo runs ruff + prettier + shfmt
              in pre-commit and intentionally avoids redundant comments.
            - Do NOT leave general praise or summary fluff.
            - If you have nothing substantive to flag, post a single
              short top-level comment saying "No issues found." That's
              the success signal — silence isn't.
            - When you do flag something, the comment body MUST include
              the file path, the concrete failure mode, and the fix.
            - Whenever the fix is a single contiguous edit in one
              file, put it in a GitHub `suggestion` block in the
              inline comment so the author can commit it with one
              click — don't paraphrase the fix in prose if it fits.
              The syntax is:

                  ```suggestion
                  <new content that replaces the commented line range>
                  ```

              Pick the comment's line range to cover exactly the
              lines the suggestion should replace; the replacement
              can be a different number of lines than the range. For
              fixes that span multiple files or non-contiguous line
              ranges, leave one suggestion block per file/range. For
              architectural changes or fixes that don't fit a single
              range cleanly, use prose. (One edge case to avoid:
              don't put a `suggestion` block on a line containing
              both `"` and `'` — a tool bug corrupts the body. Use
              prose for that line instead.)

          # mcp__github_inline_comment__create_inline_comment is the
          # action's built-in inline-comment tool (loads only when named
          # here). Bash gh allowlist is the fallback path the official
          # pr-review-comprehensive.yml example uses for top-level
          # comments and diff-fetching.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
      # The action's SDK call writes a JSONL transcript (per-turn tool_use,
      # tool_result, permission events) to runner.temp/claude-execution-output.json.
      # The action redacts those events from the public CI log "for security";
      # uploading the raw record as an artifact keeps it visible only to
      # collaborators — needed for diagnosing permission denials and turn-count
      # blowups. `if: always()` so we capture failures too.
      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name:
            claude-execution-output-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 14
