default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        # Unified-diff blank context lines are ` \n` (single leading space
        # then newline); trim-trailing-whitespace flattens those to `\n`
        # and `patch -p1` then refuses the file as "malformed patch".
        # Skip *.patch so the in-tree extension patches keep parsing.
        exclude: '\.patch$'
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
        # Upstream's pre-commit-hooks restricts this hook to
        # [pre-commit, pre-push, manual]. prek 0.4.x runs it on
        # commit-msg too, where the COMMIT_EDITMSG path is presented
        # with leading `../../../` segments that the hook's own regex
        # flags as illegal (/../). Pin the stages here to match
        # upstream and stop the spurious commit-msg failure.
        stages: [pre-commit, pre-push, manual]
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        files: ^(build|extensions|tests)/.*\.py$
        pass_filenames: false
        args: [build, extensions, tests]
      - id: check-extensions-annotated
        name: check build/extensions.txt URLs are annotated
        entry: python3 build/check_extensions_annotated.py
        language: system
        files: ^build/(extensions\.txt|check_extensions_annotated\.py)$
        pass_filenames: false

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words-list", "hass"]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        args: ["--prose-wrap", "always"]
        language_version: system

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: \.sh$
        args: ["-S", "warning", "-e", "SC1091"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.0-1
    hooks:
      - id: shfmt
        files: \.sh$
        args: ["-w", "-i", "2", "-ci"]

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        args: ["--ignore", "DL3006", "--ignore", "DL3008", "--ignore", "DL3059"]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: Ensure Python copyright header
        files: \.py$
        args:
          - --license-filepath
          - .copyright-header.txt
          - --comment-style
          - "#"
          - --detect-license-in-X-top-lines=8

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-jsonschema
        name: Validate pre-commit config schema
        files: ^\.pre-commit-config\.yaml$
        args:
          - --schemafile
          - https://json.schemastore.org/pre-commit-config.json
      - id: check-jsonschema
        name: Validate commitlint config schema
        files: ^\.commitlintrc\.json$
        args:
          - --schemafile
          - https://json.schemastore.org/commitlintrc.json
      - id: check-github-workflows
      - id: check-renovate
      - id: check-jsonschema
        name: Validate Home Assistant add-on config schema
        files: ^config\.json$
        args:
          - --regex-variant
          - python
          - --schemafile
          - https://raw.githubusercontent.com/frenck/action-addon-linter/v2.21.0/src/config.schema.json
      - id: check-jsonschema
        name: Validate Home Assistant add-on build schema
        files: ^build\.ya?ml$
        args:
          - --regex-variant
          - python
          - --schemafile
          - https://raw.githubusercontent.com/frenck/action-addon-linter/v2.21.0/src/build.schema.json
