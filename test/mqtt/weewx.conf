##############################################################################
#   Integration-test weewx.conf — MQTT-only path (SQLite-backed).
#
#   Exercises the MQTT publisher's `weewx_ha.Controller` (by felddy) against the `mosquitto` compose
#   service in docker-compose.mqtt.yml: discovery topics, state_class,
#   availability, rain24h, archive-only fields, xaggs loaded clean.
#
#   Storage is SQLite (/config/db/weewx.sdb) — weewx needs *some* archive
#   backend for the archive cycle to fire, but the MQTT side is independent
#   of whether that backend is SQLite or MariaDB. MariaDB-as-backend itself
#   is covered separately by the `e2e: mariadb` job.
##############################################################################

WEEWX_ROOT = /opt/weewx-data

[Station]
    location     = "ha-weewx mqtt test"
    latitude     = 42.36
    longitude    = -71.06
    altitude     = 10, meter
    station_type = Simulator

[Simulator]
    driver        = weewx.drivers.simulator
    mode          = simulator
    loop_interval = 2.0

[StdReport]
    SKIN_ROOT    = skins
    HTML_ROOT    = /config/www
    data_binding = wx_binding

[StdConvert]
    target_unit = METRICWX

[StdCalibrate]
    [[Corrections]]

[StdQC]
    [[MinMax]]
        barometer   = 26, 32.5, inHg
        outTemp     = -40, 120, degree_F
        inTemp      = 10, 120, degree_F
        outHumidity = 0, 100
        inHumidity  = 0, 100
        windSpeed   = 0, 120, mile_per_hour
        rainRate    = 0, 10, inch_per_hour

[StdArchive]
    # 5 s archive interval so the archive-only MQTT test (windrun) fires
    # quickly. Same rationale as test/mariadb/weewx.conf.
    archive_interval  = 5
    archive_delay     = 3
    no_catchup        = True
    record_generation = software
    data_binding      = wx_binding

[DataBindings]
    [[wx_binding]]
        database   = archive_sqlite
        table_name = archive
        manager    = weewx.manager.DaySummaryManager
        schema     = schemas.wview_extended.schema

[Databases]
    [[archive_sqlite]]
        database_name = /config/db/weewx.sdb
        driver        = weedb.sqlite

[StdRESTful]
    [[StationRegistry]]
        register_this_station = False

##############################################################################
#   MQTT -> Home Assistant discovery via the MQTT publisher (by felddy):
#   `weewx_ha.Controller`. The `mosquitto` compose service runs anonymous
#   on 1883.
##############################################################################

[HomeAssistant]
    node_id                = weewx
    discovery_topic_prefix = homeassistant
    state_topic_prefix     = weather
    unit_system            = METRICWX

    [[mqtt]]
        hostname = mosquitto
        port     = 1883
        username = test
        password = test
        use_tls  = False

    [[station]]
        name         = Integration Test Station
        model        = Simulator
        manufacturer = WeeWX

[StdWXCalculate]
    # windrun lands in archive records only — used by the archive-only MQTT
    # test to verify the MQTT publisher's NEW_ARCHIVE_RECORD binding (patches/venv/0004)
    # actually surfaces archive-only fields to MQTT.
    [[Calculations]]
        windrun = software

# user.rain24h.Rain24h injects rain24h into every loop packet; the MQTT
# test verifies (a) the extension installed, (b) the field reaches MQTT
# via the MQTT publisher, (c) the publisher's KEY_CONFIG entry from
# patches/venv/0005 gives it the right device_class/unit.
[Rain24h]
    enable = true

[Engine]
    [[Services]]
        prep_services    = weewx.engine.StdTimeSynch
        data_services    = user.rain24h.Rain24h
        process_services = weewx.engine.StdConvert, weewx.engine.StdCalibrate, weewx.engine.StdQC, weewx.wxservices.StdWXCalculate
        xtype_services   = weewx.wxxtypes.StdWXXTypes, weewx.wxxtypes.StdPressureCooker, weewx.wxxtypes.StdRainRater, weewx.wxxtypes.StdDelta, user.xaggs.XAggsService
        archive_services = weewx.engine.StdArchive
        restful_services = weewx.restx.StdStationRegistry
        report_services  = weewx.engine.StdPrint, weewx.engine.StdReport, weewx_ha.Controller

[Logging]
    version = 1
    disable_existing_loggers = False

    [[root]]
        level    = INFO
        handlers = console,

    [[formatters]]
        [[[standard]]]
            format = "%(asctime)s  %(name)s %(levelname)s %(message)s"

    [[handlers]]
        [[[console]]]
            class     = logging.StreamHandler
            formatter = standard
            stream    = ext://sys.stdout

    [[loggers]]
        [[[weewx]]]
            level     = INFO
            handlers  = console,
            propagate = False
        [[[weewx_ha]]]
            level     = INFO
            handlers  = console,
            propagate = False
