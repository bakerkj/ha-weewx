##############################################################################
#   Integration-test weewx.conf — MariaDB-only path.
#
#   Exercises that weewx + the bundled image can write archive records to
#   MariaDB (the `mariadb` compose service in docker-compose.mariadb.yml)
#   and that the Seasons report still generates + is served by nginx.
#
#   MQTT discovery, rain24h, xaggs, and the MQTT publisher's NEW_ARCHIVE bind are
#   covered by the separate `e2e: mqtt` job (test/mqtt/weewx.conf), which
#   uses a SQLite backend — no MariaDB needed for those concerns.
##############################################################################

WEEWX_ROOT = /opt/weewx-data

[Station]
    location     = "ha-weewx mariadb test"
    latitude     = 42.36
    longitude    = -71.06
    altitude     = 10, meter
    station_type = Simulator

[Simulator]
    driver        = weewx.drivers.simulator
    mode          = simulator
    loop_interval = 2.0

[StdReport]
    SKIN_ROOT    = skins
    HTML_ROOT    = /config/www
    data_binding = wx_binding

    [[SeasonsReport]]
        skin   = Seasons
        enable = True

[StdConvert]
    target_unit = METRICWX

[StdCalibrate]
    [[Corrections]]

[StdQC]
    [[MinMax]]
        barometer   = 26, 32.5, inHg
        outTemp     = -40, 120, degree_F
        inTemp      = 10, 120, degree_F
        outHumidity = 0, 100
        inHumidity  = 0, 100
        windSpeed   = 0, 120, mile_per_hour
        rainRate    = 0, 10, inch_per_hour

[StdArchive]
    # Short interval so the test sees an archive row without a long wait.
    # 5 s is the minimum that StdWXCalculate's running-aggregate logic stays
    # comfortable with on the Simulator driver.
    archive_interval  = 5
    archive_delay     = 3
    no_catchup        = True
    record_generation = software
    data_binding      = wx_binding

[DataBindings]
    [[wx_binding]]
        database   = archive_mysql
        table_name = archive
        manager    = weewx.manager.DaySummaryManager
        schema     = schemas.wview_extended.schema

[Databases]
    [[archive_mysql]]
        database_name = weewx
        driver        = weedb.mysql
        host          = mariadb
        port          = 3306
        user          = weewx
        password      = weewxpass

[StdRESTful]
    [[StationRegistry]]
        register_this_station = False

[Engine]
    [[Services]]
        prep_services    = weewx.engine.StdTimeSynch
        data_services    =
        process_services = weewx.engine.StdConvert, weewx.engine.StdCalibrate, weewx.engine.StdQC, weewx.wxservices.StdWXCalculate
        xtype_services   = weewx.wxxtypes.StdWXXTypes, weewx.wxxtypes.StdPressureCooker, weewx.wxxtypes.StdRainRater, weewx.wxxtypes.StdDelta
        archive_services = weewx.engine.StdArchive
        restful_services = weewx.restx.StdStationRegistry
        report_services  = weewx.engine.StdPrint, weewx.engine.StdReport

[Logging]
    version = 1
    disable_existing_loggers = False

    [[root]]
        level    = INFO
        handlers = console,

    [[formatters]]
        [[[standard]]]
            format = "%(asctime)s  %(name)s %(levelname)s %(message)s"

    [[handlers]]
        [[[console]]]
            class     = logging.StreamHandler
            formatter = standard
            stream    = ext://sys.stdout

    [[loggers]]
        [[[weewx]]]
            level     = INFO
            handlers  = console,
            propagate = False
