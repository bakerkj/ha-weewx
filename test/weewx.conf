##############################################################################
#   Integration-test weewx.conf for docker-compose.test.yml
#
#   Exercises the add-on's two headline features against the sidecar services:
#     - MariaDB storage  -> [Databases][[archive_mysql]] points at the
#       `mariadb` compose service.
#     - MQTT -> Home Assistant discovery via felddy weewx_ha.Controller,
#       pointed at the anonymous `mosquitto` compose service.
#
#   Driver is the Simulator with a short archive_interval so an archive record
#   lands in MariaDB quickly. NOT a starter template — see
#   rootfs/etc/weewx.conf.template for that.
##############################################################################

WEEWX_ROOT = /opt/weewx-data

[Station]
    location     = "ha-weewx integration test"
    latitude     = 42.36
    longitude    = -71.06
    altitude     = 10, meter
    station_type = Simulator

[Simulator]
    driver        = weewx.drivers.simulator
    mode          = simulator
    loop_interval = 2.0

[StdReport]
    SKIN_ROOT    = skins
    HTML_ROOT    = /config/www
    data_binding = wx_binding

    [[SeasonsReport]]
        skin   = Seasons
        enable = True

[StdConvert]
    target_unit = METRICWX

[StdCalibrate]
    [[Corrections]]

[StdQC]
    [[MinMax]]
        barometer   = 26, 32.5, inHg
        outTemp     = -40, 120, degree_F
        inTemp      = 10, 120, degree_F
        outHumidity = 0, 100
        inHumidity  = 0, 100
        windSpeed   = 0, 120, mile_per_hour
        rainRate    = 0, 10, inch_per_hour

[StdArchive]
    # Short interval so the test sees an archive row without a long wait.
    archive_interval = 15
    archive_delay    = 3
    no_catchup       = True
    record_generation = software
    data_binding     = wx_binding

##############################################################################
#   Database — MariaDB (the `mariadb` compose service). WeeWX creates the
#   archive + day-summary tables on first start.
##############################################################################

[DataBindings]
    [[wx_binding]]
        database   = archive_mysql
        table_name = archive
        manager    = weewx.manager.DaySummaryManager
        schema     = schemas.wview_extended.schema

[Databases]
    [[archive_mysql]]
        database_name = weewx
        driver        = weedb.mysql
        host          = mariadb
        port          = 3306
        user          = weewx
        password      = weewxpass

[StdRESTful]
    [[StationRegistry]]
        register_this_station = False

##############################################################################
#   MQTT -> Home Assistant discovery (felddy weewx_ha.Controller).
#   The `mosquitto` compose service runs anonymous on 1883, so TLS off and
#   throwaway credentials (username/password are required by the extension).
#   [[mqtt]] forbids unknown keys — use `use_tls`, not `tls`.
##############################################################################

[HomeAssistant]
    node_id                = weewx
    discovery_topic_prefix = homeassistant
    state_topic_prefix     = weather
    unit_system            = METRICWX

    [[mqtt]]
        hostname = mosquitto
        port     = 1883
        username = test
        password = test
        use_tls  = False

    [[station]]
        name         = Integration Test Station
        model        = Simulator
        manufacturer = WeeWX

[StdWXCalculate]
    # windrun is computed by StdWXXTypes only on archive records, not loop
    # packets — used by test_mqtt_archive_only_field_published to verify the
    # felddy NEW_ARCHIVE_RECORD binding (patches/venv/0004) actually surfaces
    # archive-only fields to MQTT. Without the binding, weather/windrun would
    # never be published.
    [[Calculations]]
        windrun = software

[Engine]
    [[Services]]
        prep_services    = weewx.engine.StdTimeSynch
        data_services    =
        process_services = weewx.engine.StdConvert, weewx.engine.StdCalibrate, weewx.engine.StdQC, weewx.wxservices.StdWXCalculate
        xtype_services   = weewx.wxxtypes.StdWXXTypes, weewx.wxxtypes.StdPressureCooker, weewx.wxxtypes.StdRainRater, weewx.wxxtypes.StdDelta
        archive_services = weewx.engine.StdArchive
        restful_services = weewx.restx.StdStationRegistry
        report_services  = weewx.engine.StdPrint, weewx.engine.StdReport, weewx_ha.Controller

[Logging]
    version = 1
    disable_existing_loggers = False

    # Root -> stdout (WeeWX's default targets syslog /dev/log, absent here).
    [[root]]
        level    = INFO
        handlers = console,

    [[formatters]]
        [[[standard]]]
            format = "%(asctime)s  %(name)s %(levelname)s %(message)s"

    [[handlers]]
        [[[console]]]
            class     = logging.StreamHandler
            formatter = standard
            stream    = ext://sys.stdout

    [[loggers]]
        [[[weewx]]]
            level     = INFO
            handlers  = console,
            propagate = False
        [[[weewx_ha]]]
            level     = INFO
            handlers  = console,
            propagate = False
