configuration:
  watchdog_path:
    name: Watchdog path
    description: >-
      URL path probed through the addon's own nginx (e.g. `/index.html`,
      `/gauge-data.txt`). Empty = watchdog disabled. Pick a path whose source
      you trust to rewrite regularly.
  watchdog_max_age_seconds:
    name: Maximum Last-Modified age (seconds)
    description: >-
      A probe is counted as a failure if the response's `Last-Modified` is older
      than this many seconds. Set it to roughly the cadence of whatever writes
      the URL (archive_interval for `/index.html`; LOOP cadence for
      `/gauge-data.txt`).
  watchdog_consecutive_failures:
    name: Consecutive failures before tear-down
    description: >-
      How many failed probes in a row before the addon is brought down (so Home
      Assistant's "Watchdog" toggle can restart it).
  watchdog_interval_seconds:
    name: Probe interval (seconds)
    description: Seconds between probes.
  watchdog_startup_grace_seconds:
    name: Startup grace (seconds)
    description: >-
      Sleep this long after addon start before the first probe. Must be at least
      as large as "Maximum Last-Modified age" — otherwise the first probe will
      trip on a file that hasn't been refreshed yet, and the watchdog will kill
      the addon for no real reason.
  report_hook_command:
    name: Post-report command (argv)
    description: >-
      Command to run when a report cycle finishes, as an argv list (first entry
      is the executable, subsequent entries are its arguments). Empty =
      disabled. Requires `user.report_hook.ReportHook` to be added to the skin's
      `[Generators] generator_list` in `weewx.conf`. Each element is passed
      through `expandvars`, so `$TOKEN` / `${TOKEN}` substitutes from the
      "Post-report env vars" list below.
  report_hook_frequency:
    name: Post-report frequency
    description: >-
      `every` fires the command after each report cycle. `once` fires it only on
      the first successful report cycle after addon start (a marker file in
      `/tmp` tracks the "already fired" state; container restart clears it).
  report_hook_timeout:
    name: Post-report timeout (seconds)
    description:
      Kill the command if it hasn't finished within this many seconds.
  report_hook_verify_file:
    name: Post-report verify-file gate
    description: >-
      Optional absolute path — the command runs only when this file exists and
      is non-empty. Guards against firing after a half-finished report cycle
      (e.g. Cheetah caught a per-template exception but the generator ran).
  report_hook_env:
    name: Post-report env vars
    description: >-
      Extra environment variables exposed to the command. `name` becomes the
      shell variable and can be referenced in the command as `$name`; `value` is
      masked in the UI so secrets stay hidden.
